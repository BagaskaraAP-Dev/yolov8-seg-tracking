name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The logic modules import neither OpenCV nor ultralytics, so this job
  # needs no torch download and finishes in seconds. It is the one that
  # tells you quickly whether the geometry or the colour maths broke.
  logic:
    name: logic (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test tools only
        run: python -m pip install --upgrade pip numpy pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test the modules that need no model
        env:
          PYTHONPATH: src
        run: pytest -q

  # The full install, so the parts that do import OpenCV and ultralytics
  # are exercised too. Torch comes from the CPU index: the CUDA wheel is
  # several gigabytes and nothing here runs inference.
  full:
    name: full install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU torch first so ultralytics does not pull the CUDA build
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: The command line starts and documents itself
        run: |
          segtrack --version
          segtrack --help
          python -m segtrack --help > /dev/null

      - name: Bad input is rejected before any weights are downloaded
        run: |
          if segtrack --source nonexistent.mp4 --device tpu; then
            echo "expected a non-zero exit code for an unknown device"
            exit 1
          fi
